name: CI

on:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: emissor_test
          POSTGRES_PASSWORD: emissor_test_password
          POSTGRES_DB: emissor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emissor_test -d emissor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: emissor_test
      DB_PASSWORD: emissor_test_password
      DB_NAME: emissor_test
      JWT_SECRET: ci-only-secret-for-automated-tests-123456789
      CORA_BASE_URL: https://cora.example.test
      CORA_TOKEN_URL: https://cora.example.test/oauth/token
      EMAIL_FROM: ci@example.test
      INTERNAL_ALERT_EMAIL: alerts@example.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run migration:run

      - run: npm test